services:
  - type: web
    name: veilora-p2p
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true
